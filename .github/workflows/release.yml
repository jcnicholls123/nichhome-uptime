name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"

      - name: Test release
        run: |
          npm ci
          npm run check
          npm test

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            gh release create "${GITHUB_REF_NAME}" --title "NichHome Uptime ${GITHUB_REF_NAME}" --generate-notes --prerelease --verify-tag
          else
            gh release create "${GITHUB_REF_NAME}" --title "NichHome Uptime ${GITHUB_REF_NAME}" --generate-notes --latest --verify-tag
          fi
